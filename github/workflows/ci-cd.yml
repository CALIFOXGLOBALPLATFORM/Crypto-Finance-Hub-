name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install dependencies & run tests
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

      # Build Docker images
      - name: Build backend image
        run: docker build -t crypto-backend ./backend

      - name: Build frontend image
        run: docker build -t crypto-frontend ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push images
      - name: Push backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/crypto-backend:latest ./backend && docker push ${{ secrets.DOCKER_USERNAME }}/crypto-backend:latest

      - name: Push frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/crypto-frontend:latest ./frontend && docker push ${{ secrets.DOCKER_USERNAME }}/crypto-frontend:latest

      # Deploy to server via SSH
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/crypto-finance-hub
            git pull origin main
            docker-compose pull
            docker-compose up -d --build